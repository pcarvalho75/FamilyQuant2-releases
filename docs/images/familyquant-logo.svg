<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="gTeal" cx="0.35" cy="0.30" r="0.85">
      <stop offset="0" stop-color="#9BFFEC"/><stop offset="0.5" stop-color="#2DD4BF"/><stop offset="1" stop-color="#0C6E5E"/>
    </radialGradient>
    <radialGradient id="gMint" cx="0.35" cy="0.30" r="0.85">
      <stop offset="0" stop-color="#C7FFDA"/><stop offset="0.5" stop-color="#43DE80"/><stop offset="1" stop-color="#177A3B"/>
    </radialGradient>
    <radialGradient id="gBlue" cx="0.35" cy="0.30" r="0.85">
      <stop offset="0" stop-color="#BEE6FF"/><stop offset="0.5" stop-color="#38BDF8"/><stop offset="1" stop-color="#0A5C97"/>
    </radialGradient>
    <linearGradient id="bTeal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4EE6D2"/><stop offset="1" stop-color="#0E7C6B"/></linearGradient>
    <linearGradient id="bMint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#63EE97"/><stop offset="1" stop-color="#177A3B"/></linearGradient>
    <linearGradient id="bBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5AC8FA"/><stop offset="1" stop-color="#0A5C97"/></linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="#333949"/>

  <!-- quantitation: a bar per family, heights = abundance -->
  <g filter="url(#soft)">
    <rect x="107" y="262" width="46" height="90"  rx="8" fill="url(#bTeal)"/>
    <rect x="233" y="214" width="46" height="138" rx="8" fill="url(#bMint)"/>
    <rect x="359" y="282" width="46" height="70"  rx="8" fill="url(#bBlue)"/>
  </g>
  <line x1="92" y1="353" x2="420" y2="353" stroke="#4A5568" stroke-width="3" stroke-linecap="round"/>

  <!-- family clusters: connected spheres, one colour each -->
  <g stroke-linecap="round" opacity="0.55">
    <g stroke="#7FE9DB" stroke-width="2.4">
      <line x1="130" y1="150" x2="96"  y2="116"/><line x1="130" y1="150" x2="168" y2="124"/>
      <line x1="130" y1="150" x2="106" y2="186"/><line x1="130" y1="150" x2="160" y2="182"/>
    </g>
    <g stroke="#8DF5B4" stroke-width="2.4">
      <line x1="256" y1="132" x2="214" y2="104"/><line x1="256" y1="132" x2="300" y2="108"/>
      <line x1="256" y1="132" x2="222" y2="172"/><line x1="256" y1="132" x2="294" y2="168"/><line x1="256" y1="132" x2="256" y2="78"/>
    </g>
    <g stroke="#8FD3FB" stroke-width="2.4">
      <line x1="382" y1="150" x2="348" y2="118"/><line x1="382" y1="150" x2="418" y2="126"/>
      <line x1="382" y1="150" x2="356" y2="186"/><line x1="382" y1="150" x2="408" y2="180"/>
    </g>
  </g>

  <g filter="url(#soft)">
    <!-- teal family -->
    <circle cx="96"  cy="116" r="10" fill="url(#gTeal)"/><circle cx="168" cy="124" r="11" fill="url(#gTeal)"/>
    <circle cx="106" cy="186" r="9"  fill="url(#gTeal)"/><circle cx="160" cy="182" r="8"  fill="url(#gTeal)"/>
    <circle cx="130" cy="150" r="22" fill="url(#gTeal)"/><ellipse cx="122" cy="142" rx="7" ry="5" fill="#FFFFFF" opacity="0.45"/>
    <!-- mint family -->
    <circle cx="214" cy="104" r="10" fill="url(#gMint)"/><circle cx="300" cy="108" r="11" fill="url(#gMint)"/>
    <circle cx="222" cy="172" r="9"  fill="url(#gMint)"/><circle cx="294" cy="168" r="10" fill="url(#gMint)"/><circle cx="256" cy="78" r="8" fill="url(#gMint)"/>
    <circle cx="256" cy="132" r="25" fill="url(#gMint)"/><ellipse cx="247" cy="123" rx="8" ry="5" fill="#FFFFFF" opacity="0.45"/>
    <!-- blue family -->
    <circle cx="348" cy="118" r="10" fill="url(#gBlue)"/><circle cx="418" cy="126" r="10" fill="url(#gBlue)"/>
    <circle cx="356" cy="186" r="9"  fill="url(#gBlue)"/><circle cx="408" cy="180" r="8"  fill="url(#gBlue)"/>
    <circle cx="382" cy="150" r="22" fill="url(#gBlue)"/><ellipse cx="374" cy="142" rx="7" ry="5" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="416" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="600" fill="#FFFFFF" letter-spacing="0.5">FamilyQuant<tspan font-size="18" dy="-20">™</tspan></text>
  <text x="258" y="446" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#9BA6BC" letter-spacing="4">PROTEIN&#160;FAMILY&#160;QUANTITATION</text>
</svg>
